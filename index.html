<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOORO TRENDY</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;text-align:center;padding:15px}
h1{color:#ffeb3b;font-size:32px}
.song{background:#121212;border:1px solid #333;padding:15px;border-radius:15px;margin:15px 0}
.download{background:#ffeb3b;color:#000;display:block;padding:16px;font-weight:900;text-decoration:none;border-radius:12px;margin-top:10px;font-size:19px;border:3px solid red}
audio{width:100%;margin-top:10px}
#adminArea{display:none;background:#1a1a1a;padding:15px;border-radius:15px;margin-top:25px;text-align:left;border:2px solid #ffeb3b}
input{width:95%;padding:12px;margin:6px 0;border-radius:8px;border:none}
.btn{padding:12px 20px;border:none;border-radius:8px;font-weight:bold}
</style>
</head>
<body>
<h1>TOORO TRENDY</h1>
<p>The Home of Tooro Music</p>
<div id="songs"></div>

<!-- THIS IS THE SINGLE PASSWORD GATE -->
<button onclick="unlock()" style="margin-top:50px;background:#222;color:#666;border:none;padding:10px;border-radius:8px">Admin</button>

<div id="adminArea">
<h3>TOORO Admin - Upload</h3>
<input id="title" placeholder="Song Title">
<input id="artist" placeholder="Artist Name">
<input id="file" type="file" accept="audio/*">
<br><br>
<button class="btn" style="background:#00ff88" onclick="upload()">Upload Song</button>
<button class="btn" style="background:red;color:#fff" onclick="lock()">Lock 🔒</button>
<p style="color:#888;font-size:12px">Only you see this after password. Fans never see it.</p>
</div>

<script>
const PASSWORD = "tooro2024"; // CHANGE YOUR PASSWORD HERE
let songs = JSON.parse(localStorage.getItem("tooro_db")||"[]");

function unlock(){
 let p = prompt("Enter TOORO Admin Password:");
 if(p === PASSWORD){
   document.getElementById("adminArea").style.display="block";
 } else if(p!== null){
   alert("Wrong password!");
 }
}
function lock(){ document.getElementById("adminArea").style.display="none"; }

function upload(){
 let f = document.getElementById("file").files[0];
 if(!f) return alert("Select audio file");
 let r = new FileReader();
 r.onload = e => {
   songs.unshift({t:document.getElementById("title").value||"Untitled", a:document.getElementById("artist").value||"Tooro Artist", url:e.target.result});
   localStorage.setItem("tooro_db", JSON.stringify(songs));
   render(); alert("Song Added!");
 };
 r.readAsDataURL(f);
}

function render(){
 let html="";
 songs.forEach(s=>{
   html+=`<div class="song"><b>${s.t}</b> - ${s.a}<audio controls src="${s.url}"></audio><a class="download" href="${s.url}" download="${s.t}.mp3">⬇ DOWNLOAD MP3</a></div>`;
 });
 if(!html) html="<p>No songs yet. Click Admin to add first song.</p>";
 document.getElementById("songs").innerHTML=html;
}
render();
</script>
</body>
</html>
